# stage0 netboot — dnsmasq DHCP + TFTP configuration (task 3.4, stage0-netboot-image).
#
# Boot chain:
#   client firmware (BIOS/UEFI)  --DHCP option 93-->  iPXE chainloader
#   iPXE chainloader             --TFTP-->            undionly.kpxe | ipxe.efi
#   iPXE                         --HTTP-->            menu.ipxe -> vmlinuz-lts +
#                                                     initramfs-stage0 + modloop-lts
#
# Both firmware paths converge on the SAME stage0 artifacts: vmlinuz-lts,
# initramfs-stage0, and modloop-lts. dnsmasq serves the iPXE chainloaders over
# TFTP; the kernel/initramfs/modloop are fetched by iPXE over HTTP (see
# boot/menu.ipxe) from a server publishing the same root as the TFTP root, and
# are also reachable over TFTP as a fallback.
#
# Adjust the network-specific values below to the deployment subnet.

# ---------------------------------------------------------------------------
# DHCP
# ---------------------------------------------------------------------------
# Listen on the deployment interface (uncomment and set).
#interface=eth0
#bind-interfaces

# DHCP lease range for PXE clients (uncomment and set to your subnet).
#dhcp-range=192.168.1.50,192.168.1.150,255.255.255.0,12h

# ---------------------------------------------------------------------------
# TFTP — serves the iPXE chainloaders and the shared stage0 artifacts
# ---------------------------------------------------------------------------
enable-tftp
tftp-root=/srv/netinstall

# ---------------------------------------------------------------------------
# Firmware-based iPXE chainloader selection (DHCP option 93, client-arch)
# ---------------------------------------------------------------------------
#   arch  0 = x86 BIOS        -> undionly.kpxe
#   arch  7 = x86-64 UEFI     -> ipxe.efi
#   arch  9 = x86-64 UEFI (HTTP boot) -> ipxe.efi
dhcp-match=set:bios,option:client-arch,0
dhcp-match=set:efi64,option:client-arch,7
dhcp-match=set:efi64-http,option:client-arch,9

dhcp-boot=tag:bios,undionly.kpxe
dhcp-boot=tag:efi64,ipxe.efi
dhcp-boot=tag:efi64-http,ipxe.efi

# Legacy BIOS PXE clients that omit option 93 fall back to undionly.kpxe.
dhcp-boot=undionly.kpxe

# ---------------------------------------------------------------------------
# iPXE -> menu.ipxe handoff
# ---------------------------------------------------------------------------
# Once iPXE is loaded it re-issues DHCP with user-class "iPXE"; answer it with
# the menu script. iPXE fetches menu.ipxe over TFTP, then uses HTTP (per
# boot/menu.ipxe) to pull vmlinuz-lts, initramfs-stage0, and modloop-lts.
dhcp-userclass=set:ipxe,iPXE
dhcp-boot=tag:ipxe,menu.ipxe

# Advertise this server as the DHCP next-server (uncomment and set) so iPXE can
# derive the HTTP URL in boot/menu.ipxe from ${net0/next-server}.
#dhcp-option=option:next-server,SERVER_IP
