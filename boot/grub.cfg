# stage0 ISO/USB boot menu — GRUB configuration (task 3.4, stage0-netboot-image).
#
# Used by the hybrid BIOS+UEFI ISO and the dd-able USB image (built by task 3.5
# via grub-mkrescue). grub-mkrescue installs both the i386-pc (BIOS) and
# x86_64-efi (UEFI) loaders, so this single menu entry boots either firmware.
#
# It chain-loads the SAME stage0 artifacts as the netboot path (boot/menu.ipxe):
#   vmlinuz-lts         Alpine -lts kernel
#   initramfs-stage0    custom stage0 initramfs (built by task 3.3)
#   modloop-lts         Alpine -lts module bundle
#
# The kernel cmdline carries the Alpine boot tokens:
#   alpine_repo=   apk repository root (empty: payload is baked in)
#   modloop=/modloop-lts   module loopback squashfs at the media root
#
# The build assembly (task 3.5) places vmlinuz-lts, initramfs-stage0, and
# modloop-lts at the root of the ISO/USB filesystem.

set timeout=5
set default=0

menuentry "netinstall stage0 installer" {
    linux /vmlinuz-lts alpine_repo= modloop=/modloop-lts
    initrd /initramfs-stage0
}
